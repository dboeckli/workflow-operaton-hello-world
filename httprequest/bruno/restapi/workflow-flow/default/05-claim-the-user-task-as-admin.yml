          if (response.status === 200 && Array.isArray(response.data) && response.data.length > 0) {
            task = response.data[0];
            break;
          }
          if (attempt === 30) {
            throw new Error("say-hello task did not become available");
          }
          await bru.sleep(2000);
        }
        bru.setVar("taskId", task.id);
